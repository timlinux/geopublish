<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44506b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="640" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="30" y="30" width="260" height="50" rx="6" fill="#eef3f8" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="160" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3a55">vector/raster file</text>
  <text x="160" y="67" text-anchor="middle" font-size="11" fill="#55607a">.gpkg, .shp, .tif, ...</text>

  <rect x="330" y="30" width="260" height="50" rx="6" fill="#eef3f8" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="460" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3a55">PDF plan sheet(s)</text>
  <text x="460" y="67" text-anchor="middle" font-size="11" fill="#55607a">single file or a folder</text>

  <!-- CLI commands -->
  <rect x="30" y="130" width="260" height="50" rx="6" fill="#dfe9f5" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3a55">gp publish</text>
  <text x="160" y="167" text-anchor="middle" font-size="11" fill="#55607a">vector / raster</text>

  <rect x="330" y="130" width="260" height="50" rx="6" fill="#dfe9f5" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="460" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3a55">gp prepare</text>
  <text x="460" y="167" text-anchor="middle" font-size="11" fill="#55607a">pdf-to-geotiff</text>

  <!-- PDF detour -->
  <rect x="330" y="220" width="260" height="50" rx="6" fill="#f8f3e3" stroke="#8a6d1d" stroke-width="1.5"/>
  <text x="460" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#6b5414">pdftocairo / pdftotext</text>
  <text x="460" y="257" text-anchor="middle" font-size="11" fill="#7a6326">detect frame + corner coords</text>

  <rect x="330" y="300" width="260" height="50" rx="6" fill="#f8f3e3" stroke="#8a6d1d" stroke-width="1.5"/>
  <text x="460" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#6b5414">gdal_translate</text>
  <text x="460" y="337" text-anchor="middle" font-size="11" fill="#7a6326">clip to frame + georeference</text>

  <rect x="390" y="380" width="140" height="36" rx="4" fill="#ffffff" stroke="#8a6d1d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="403" text-anchor="middle" font-size="12" fill="#6b5414">GeoTIFF</text>

  <!-- publish tool shell -->
  <rect x="30" y="220" width="260" height="50" rx="6" fill="#dfe9f5" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="160" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#2b3a55">ogr2ogr /</text>
  <text x="160" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#2b3a55">raster2pgsql | psql</text>

  <!-- QGIS, separate path -->
  <rect x="660" y="220" width="200" height="50" rx="6" fill="#eef3f8" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="760" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3a55">QGIS</text>
  <text x="760" y="257" text-anchor="middle" font-size="11" fill="#55607a">never touches gp</text>

  <!-- Postgres cylinder -->
  <g>
    <path d="M 330 540 L 330 480 A 140 18 0 0 1 610 480 L 610 540 A 140 18 0 0 1 330 540 Z" fill="#e8f5ec" stroke="#2f6b3f" stroke-width="1.5"/>
    <ellipse cx="470" cy="480" rx="140" ry="18" fill="#e8f5ec" stroke="#2f6b3f" stroke-width="1.5"/>
    <text x="470" y="518" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6b3f">PostgreSQL</text>
    <text x="470" y="535" text-anchor="middle" font-size="12" fill="#3f7d4f">+ PostGIS</text>
  </g>

  <!-- Arrows: inputs -> CLI -->
  <line x1="160" y1="80" x2="160" y2="128" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="80" x2="460" y2="128" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- publish -> tool shell -->
  <line x1="160" y1="180" x2="160" y2="218" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- prepare -> pdf detour chain -->
  <line x1="460" y1="180" x2="460" y2="218" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="270" x2="460" y2="298" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="350" x2="460" y2="378" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GeoTIFF loops back into publish -->
  <path d="M 388 398 C 220 398 120 300 120 268" fill="none" stroke="#8a6d1d" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrow)"/>
  <text x="195" y="330" text-anchor="middle" font-size="10.5" fill="#6b5414">re-enters as an ordinary</text>
  <text x="195" y="343" text-anchor="middle" font-size="10.5" fill="#6b5414">raster via gp publish</text>

  <!-- tool shell -> postgres -->
  <path d="M 160 270 C 160 400 260 470 332 495" fill="none" stroke="#44506b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="430" font-size="11" fill="#44506b">INSERT / COPY rows</text>

  <!-- QGIS -> postgres -->
  <path d="M 720 270 C 640 380 560 450 525 487" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="400" font-size="11" fill="#2f6b3f">PGSERVICEFILE</text>
  <text x="640" y="414" font-size="11" fill="#2f6b3f">no password typed</text>

  <!-- devshell boundary -->
  <rect x="12" y="105" width="886" height="190" rx="10" fill="none" stroke="#9aa5b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="884" y="122" text-anchor="end" font-size="11" fill="#6b7589">nix develop (flake.nix) devShell</text>
</svg>
